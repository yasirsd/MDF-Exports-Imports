<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8F8F6" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Disable browser auto-translation: it wraps text nodes in <font> tags,
         which desyncs React's DOM references and throws insertBefore errors. -->
    <meta name="google" content="notranslate" />

    <title>MDF Exports &amp; Imports — Exporting India's Freshness to the World</title>
    <meta
      name="description"
      content="MDF Exports &amp; Imports delivers premium fruits, vegetables, spices and agricultural products from Andhra Pradesh, India to the Gulf, Asia-Pacific and beyond — built on 40+ years of agricultural excellence."
    />

    <!-- Critical: font + LCP hero only. Unsplash is dns-prefetch (not preconnect)
         so it does not compete with first-party LCP bandwidth. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/hero/farm-sunrise-1600.jpg"
      as="image"
      imagesrcset="/hero/farm-sunrise-640.jpg 640w, /hero/farm-sunrise-1080.jpg 1080w, /hero/farm-sunrise-1600.jpg 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
